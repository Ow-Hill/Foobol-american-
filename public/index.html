<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />

  <title>Roster Monitor · James Cook Lovers</title>

<body>

      <div class="top-right">
        <label class="viewas">Viewing <select id="teamSelect" aria-label="Team to view"></select></label>

  </div>
  <script type="module" src="/js/app.js"></script>
</body>

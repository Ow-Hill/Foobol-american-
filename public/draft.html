<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Live draft guide · Roster Monitor</title>
  <meta name="theme-color" content="#0a0e13" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230a0e13'/%3E%3Cellipse cx='16' cy='16' rx='11' ry='6.5' transform='rotate(-35 16 16)' fill='%233ddc84'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="/styles.css" />
  <style>
    .dg { max-width: 1320px; margin: 0 auto; padding: 18px 20px 60px; display: flex; flex-direction: column; gap: 14px; }
    .dg-top { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
    .dg-top h1 { font-size: 20px; margin: 0; }
    .dg-top .grow { flex: 1; }
    .dg-find { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
    .dg-find input { background: var(--panel); border: 1px solid var(--line2); border-radius: 8px; padding: 7px 10px; color: var(--text); min-width: 280px; font: inherit; }
    .dg-status { display: flex; gap: 18px; flex-wrap: wrap; align-items: center; padding: 12px 16px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--panel); }
    .dg-status .big { font-size: 22px; font-weight: 750; }
    .dg-status small { display: block; color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: .08em; }
    .dg-status.onclock { border-color: var(--green); background: linear-gradient(135deg, #12311f, var(--panel)); box-shadow: 0 0 0 1px var(--green) inset; }
    .dg-status.onclock .big { color: var(--green); }
    .dg-grid { display: grid; grid-template-columns: minmax(0, 1.05fr) minmax(0, 1fr); gap: 14px; align-items: start; }
    @media (max-width: 980px) { .dg-grid { grid-template-columns: 1fr; } .dg-find input { min-width: 0; width: 100%; } }
    .dg-grid > * { min-width: 0; }
    .dg .tbl-wrap { overflow-x: auto; }
    .dg-status > div { min-width: 0; }
    .rec { display: flex; flex-direction: column; gap: 10px; }
    .rec-i { border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; background: var(--bg2); }
    .rec-i.first { border-color: var(--green); }
    .rec-h { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
    .rec-h .val { margin-left: auto; font-weight: 750; font-variant-numeric: tabular-nums; }
    .rec-i ul { margin: 6px 0 0; padding-left: 18px; color: var(--muted); font-size: 13px; display: flex; flex-direction: column; gap: 2px; }
    .rec-i ul li:first-child { color: var(--text); }
    .dg-tabs { display: flex; gap: 4px; flex-wrap: wrap; padding: 0 16px 8px; }
    .dg-tabs button { background: none; border: 1px solid var(--line2); color: var(--muted); border-radius: 99px; padding: 3px 10px; cursor: pointer; font: inherit; font-size: 12.5px; }
    .dg-tabs button.on { background: var(--panel2); color: var(--text); border-color: var(--green); }
    .dg-tabs input { margin-left: auto; background: var(--panel); border: 1px solid var(--line2); border-radius: 8px; padding: 3px 8px; color: var(--text); font: inherit; font-size: 12.5px; }
    tr.gone td { opacity: .35; text-decoration: line-through; }
    .camp-up { color: var(--green); } .camp-down { color: var(--red); }
    .feed-i { display: flex; gap: 8px; padding: 4px 16px; font-size: 13px; border-bottom: 1px solid var(--line); }
    .feed-i .num { color: var(--muted); min-width: 44px; }
    .feed-i.mine { background: #12311f55; }
    .roster-row { display: flex; gap: 10px; padding: 3px 0; font-size: 13.5px; }
    .roster-row .slot { min-width: 76px; color: var(--muted); font-size: 12px; }
    .alerts { display: flex; flex-direction: column; gap: 6px; font-size: 13.5px; }
    .alerts .a { padding: 6px 10px; border-left: 3px solid var(--amber); background: var(--bg2); border-radius: 4px; }
    .alerts .a.g { border-color: var(--green); }
    .dg-foot { color: var(--dim); font-size: 12px; max-width: 110ch; }
    .replay { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; font-size: 13px; color: var(--muted); }
    .replay input[type=range] { width: 260px; }
    a.pn { color: inherit; text-decoration: none; } a.pn:hover { text-decoration: underline; }
    .dg-modal { position: fixed; inset: 0; background: #000a; z-index: 50; display: flex; justify-content: flex-end; }
    .dg-sheet { width: min(560px, 100%); height: 100%; overflow-y: auto; background: var(--bg2); border-left: 1px solid var(--line2); padding: 18px 20px 40px; position: relative; font-size: 14px; }
    .dg-sheet h3 { font-size: 11.5px; text-transform: uppercase; letter-spacing: .1em; color: var(--muted); margin: 16px 0 6px; }
    .dg-x { position: absolute; top: 12px; right: 12px; }
    .dg-news { margin: 0; padding-left: 18px; display: flex; flex-direction: column; gap: 6px; }
    .dg-news a { color: var(--text); }
    .dlist button { display: block; width: 100%; text-align: left; margin-bottom: 6px; }
  </style>
</head>
<body>
  <main class="dg" id="dg">
    <div class="dg-top">
      <a class="btn btn-ghost" href="/" title="Back to the Roster Monitor">← Roster Monitor</a>
      <h1>Live draft guide</h1>
      <div class="grow"></div>
      <form class="dg-find" id="find">
        <input id="q" placeholder="Sleeper draft link, draft or league ID, or username" aria-label="Sleeper draft link, draft ID, league ID or username" />
        <button class="btn" type="submit">Follow draft</button>
      </form>
    </div>
    <div id="body"><div class="loading"><div class="spinner"></div><p>Looking for drafts…</p></div></div>
  </main>
  <script type="module" src="/js/draftpage.js"></script>
</body>
</html>
